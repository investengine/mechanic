# Linter setup copied from investengine.com.

# The shared linters repo is planned to replace this copy. Until then
# keep revs and settings in sync, except for these deliberate differences:
# - Left out: monolith-only hooks and path excludes (django-upgrade, codeowners, makemigrations, frontend).
# - check-yaml covers this file (the monolith excludes it), so the hook has a file to check.
# - check-json is left out until the repo has a JSON file (check-hooks-apply fails otherwise).
# - Pre-commit runs in fix mode, not check mode: the monolith checks only because its CI mounts backend/ alone.
# - mypy is strict and runs from the project venv ([tool.mypy]).
# - import-linter (Mechanic-only) enforces the architecture ADR ([tool.importlinter]).
# - Hooks run on python3.14, Mechanic's Python. The monolith's linters that crash on 3.14 are upgraded.

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
    python: python3.14

repos:
    - repo: meta
      hooks:
          - id: check-hooks-apply
          - id: check-useless-excludes
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.1.0
      hooks:
          - id: trailing-whitespace
            exclude_types: [markdown]
          - id: end-of-file-fixer
          # Unlike the monolith, this checks the pre-commit config itself, so the hook
          # has a file to apply to (check-hooks-apply fails on a hook with no files)
          - id: check-yaml
            args: [--allow-multiple-documents]
          - id: check-toml
          # check-json is left out until the repo has a JSON file (check-hooks-apply)
    - repo: https://github.com/MarcoGorelli/absolufy-imports
      rev: v0.3.1
      hooks:
          - id: absolufy-imports
            # mechanic resolves from src/, tests from the repo root
            args: [--application-directories=.:src]
    - repo: https://github.com/asottile/pyupgrade
      # v2.34.0 in the monolith uses ast.Str, which Python 3.14 removed
      rev: v3.22.0
      hooks:
          - id: pyupgrade
            # we use keep-runtime-typing because we use pydantic
            # https://github.com/samuelcolvin/pydantic/issues/3300#issuecomment-1034007897
            args: [--keep-runtime-typing, --py39-plus]
    - repo: https://github.com/PyCQA/autoflake
      rev: v1.7.8
      hooks:
          - id: autoflake
            args: [-i]
    - repo: https://github.com/pycqa/isort
      rev: 5.12.0
      hooks:
          - id: isort
            args: [--settings-path=pyproject.toml]

    - repo: https://github.com/psf/black
      # 23.3.0 in the monolith uses ast.Str, which Python 3.14 removed; 23.12.1 is the
      # last release with the same (2023) stable style
      rev: 23.12.1
      hooks:
          - id: black
            args: [--config=pyproject.toml]
            additional_dependencies: ["click==8.0.4"]

    - repo: local
      hooks:
          - id: mypy
            name: mypy
            entry: uv run --no-sync mypy
            language: system
            types: [python]
            pass_filenames: false
          - id: import-linter
            name: import-linter
            entry: uv run --no-sync lint-imports
            language: system
            types: [python]
            pass_filenames: false

    - repo: https://github.com/pycqa/flake8
      rev: 6.1.0
      hooks:
          - id: flake8
            args: [--config=.flake8]
            types: [python]
            additional_dependencies:
                [
                    "flake8-comprehensions==3.12.0",
                    "flake8-debugger==4.1.2",
                    "flake8-no-pep420==2.3.0",
                    "flake8-noqa==1.3.1",
                    "flake8-print==5.0.0",
                    "flake8-useless-assert==0.4.4",
                    # 2.4.0 in the monolith uses ast.Ellipsis, which Python 3.14 removed
                    "flake8-type-checking==3.3.0",
                    "flake8-no-implicit-concat==0.3.4",
                    # 23.5.9 in the monolith crashes on 3.14 (B005); 24.12.12 is the
                    # last release that supports flake8 6
                    "flake8-bugbear==24.12.12",
                    # 0.1.3 in the monolith uses ast.Str, which Python 3.14 removed
                    "flake8-class-attributes-order==0.3.0",
                    # 0.21.0 in the monolith uses ast.NameConstant, which Python 3.14 removed
                    "flake8-simplify==0.31.1"
                ]
