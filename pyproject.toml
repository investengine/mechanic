[project]
name = "mechanic"
version = "0.1.0"
description = "InvestEngine's AI core, starting with first-line support for investigations"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic-settings~=2.16.3",
]

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "teamcity-messages~=1.33",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
