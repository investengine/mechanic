[project]
name = "mechanic"
version = "0.1.0"
description = "InvestEngine's AI core, starting with first-line support for investigations"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "pydantic-settings~=2.16.3",
]

[dependency-groups]
dev = [
    "import-linter~=2.17",
    "mypy~=2.4.1",
    "pre-commit~=4.7.0",
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "teamcity-messages~=1.33",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.black]
target_version = ["py39"]

[tool.isort]
py_version = "39"
profile = "black"
lines_between_types = 1
lines_after_imports = 2
skip_gitignore = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "mechanic"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ADR layers: adapters > routing > service > infra"
type = "layers"
layers = ["mechanic.adapters", "mechanic.routing", "mechanic.service", "mechanic.infra"]

[[tool.importlinter.contracts]]
name = "Only infra sees the engine and the model provider"
type = "forbidden"
source_modules = ["mechanic.adapters", "mechanic.routing", "mechanic.service", "mechanic.config"]
forbidden_modules = ["pydantic_ai", "anthropic", "langchain", "langchain_core", "langgraph"]
